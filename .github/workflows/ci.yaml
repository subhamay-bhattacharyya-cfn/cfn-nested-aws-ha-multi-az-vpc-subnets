name: CI Build Workflow
description: CI Build Workflow for CloudFormation VPC Subnet Stack run by {{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - 'parameters/**'
      - .github/workflows/ci.yaml
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'parameters/**'

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  ci-build:
    name: CI Build
    uses: subhamay-bhattacharyya-gha/cfn-ci-build-reusable-wf/.github/workflows/ci.yaml@feature/GHA-0001-implement-ci-build-reusab
    with:
      environment: ci
      stack-name: vpc-networking-vpc-only
      template-file: templates/vpc-networking.yaml
      parameters-file: parameters/vpc-networking-vpc-only.json

# ============================================================================
  # Generate Change Log
  # ============================================================================

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"
          git pull --rebase
          git push

  # ============================================================================
  # Release Creation
  # ============================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: subhamay-bhattacharyya-gha/create-release-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
