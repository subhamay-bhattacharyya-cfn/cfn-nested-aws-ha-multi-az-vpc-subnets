AWSTemplateFormatVersion: '2010-09-09'

Description: 'Complete VPC networking stack with public/private subnets, Internet Gateway, NAT Gateways, Network ACLs, and security groups'

Parameters:
  ApplicationPrefix:
    Type: String
    Description: Application name prefix (used for VPC, subnet, and resource naming)
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    ConstraintDescription: Must start with a letter and contain only alphanumeric characters and hyphens

  EnvironmentName:
    Type: String
    Description: Environment name prefix

  CiSuffix:
    Type: String
    Description: CI suffix for unique stack identification (optional)
    Default: ''

  VPCCidrBlock:
    Type: String
    Description: CIDR block for the VPC
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block (e.g., 10.0.0.0/16)

  EnableInternetGateway:
    Type: String
    Description: Enable Internet Gateway attachment to VPC
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableDnsHostnames:
    Type: String
    Description: Enable DNS hostnames and DNS support in VPC
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PublicSubnetCount:
    Type: Number
    Description: Number of public subnets to create
    MinValue: 1
    MaxValue: 4

  PublicSubnetCidrBlocks:
    Type: CommaDelimitedList
    Description: CIDR blocks for public subnets

  PublicSubnetAZ1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 1

  PublicSubnetAZ2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 2

  PublicSubnetAZ3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 3

  PublicSubnetAZ4:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 4

  MapPublicIpOnLaunch:
    Type: String
    Description: Automatically assign public IPs to instances in public subnets
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PublicSubnetNamePrefix:
    Type: String
    Description: Name prefix for public subnets (leave empty to use ApplicationPrefix-pub-subnet)
    Default: ''

  PublicRouteTableNamePrefix:
    Type: String
    Description: Name prefix for public route tables (leave empty to use ApplicationPrefix-pub-rt)
    Default: ''

  PrivateSubnetCount:
    Type: Number
    Description: Number of private subnets to create
    MinValue: 1
    MaxValue: 4

  PrivateSubnetCidrBlocks:
    Type: CommaDelimitedList
    Description: CIDR blocks for private subnets

  PrivateSubnetAZ1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 1

  PrivateSubnetAZ2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 2

  PrivateSubnetAZ3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 3

  PrivateSubnetAZ4:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 4

  EnableNATGateway:
    Type: String
    Description: Enable NAT Gateway for internet egress
    AllowedValues:
      - 'true'
      - 'false'

  EnableHighAvailabilityNAT:
    Type: String
    Description: Create one NAT Gateway per AZ (requires NAT enabled)
    AllowedValues:
      - 'true'
      - 'false'

  EnableNACLs:
    Type: String
    Description: Enable Network ACLs for private subnets
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PrivateSubnetNamePrefix:
    Type: String
    Description: Name prefix for private subnets (leave empty to use ApplicationPrefix-pvt-subnet)
    Default: ''

  PrivateRouteTableNamePrefix:
    Type: String
    Description: Name prefix for private route tables (leave empty to use ApplicationPrefix-pvt-rt)
    Default: ''

  PublicSubnetCidr:
    Type: String
    Description: CIDR block for public subnets (for private-to-public traffic rules)
    Default: ''

  PrivateSubnetCidr:
    Type: String
    Description: CIDR block for private subnets (for ingress rules)
    Default: ''

  AllowSSHFromPrivate:
    Type: String
    Description: Allow SSH (port 22) from private subnets to public subnets
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  AllowPingFromPrivate:
    Type: String
    Description: Allow PING (ICMP) from private subnets to public subnets
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  AllowHTTPFromInternet:
    Type: String
    Description: Allow HTTP (port 80) from internet
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  AllowHTTPSFromInternet:
    Type: String
    Description: Allow HTTPS (port 443) from internet
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  # VPC and Gateway Conditions
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, '']]
  CreateInternetGateway: !Equals [!Ref EnableInternetGateway, 'true']
  EnableDns: !Equals [!Ref EnableDnsHostnames, 'true']

  # Public Subnet Conditions
  UseAppPrefixForPublicSubnets: !Equals [!Ref PublicSubnetNamePrefix, '']
  UseAppPrefixForPublicRT: !Equals [!Ref PublicRouteTableNamePrefix, '']
  CreatePublicSubnet1: !Or [!Equals [!Ref PublicSubnetCount, 1], !Equals [!Ref PublicSubnetCount, 2], !Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]]
  CreatePublicSubnet2: !Or [!Equals [!Ref PublicSubnetCount, 2], !Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]]
  CreatePublicSubnet3: !Or [!Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]]
  CreatePublicSubnet4: !Equals [!Ref PublicSubnetCount, 4]
  MapPublicIp: !Equals [!Ref MapPublicIpOnLaunch, 'true']

  # Private Subnet Conditions
  UseAppPrefixForPrivateSubnets: !Equals [!Ref PrivateSubnetNamePrefix, '']
  UseAppPrefixForPrivateRT: !Equals [!Ref PrivateRouteTableNamePrefix, '']
  CreatePrivateSubnet1: !Or [!Equals [!Ref PrivateSubnetCount, 1], !Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]
  CreatePrivateSubnet2: !Or [!Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]
  CreatePrivateSubnet3: !Or [!Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]
  CreatePrivateSubnet4: !Equals [!Ref PrivateSubnetCount, 4]

  # NAT Gateway Conditions (require both public and private subnets)
  EnableNAT: !Equals [!Ref EnableNATGateway, 'true']
  CreateNATGateway1: !And [!Equals [!Ref EnableNATGateway, 'true'], !Or [!Equals [!Ref PublicSubnetCount, 1], !Equals [!Ref PublicSubnetCount, 2], !Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]], !Or [!Equals [!Ref PrivateSubnetCount, 1], !Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  CreateNATGateway2: !And [!Equals [!Ref EnableNATGateway, 'true'], !Equals [!Ref EnableHighAvailabilityNAT, 'true'], !Or [!Equals [!Ref PublicSubnetCount, 2], !Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]], !Or [!Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  CreateNATGateway3: !And [!Equals [!Ref EnableNATGateway, 'true'], !Equals [!Ref EnableHighAvailabilityNAT, 'true'], !Or [!Equals [!Ref PublicSubnetCount, 3], !Equals [!Ref PublicSubnetCount, 4]], !Or [!Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  CreateNATGateway4: !And [!Equals [!Ref EnableNATGateway, 'true'], !Equals [!Ref EnableHighAvailabilityNAT, 'true'], !Equals [!Ref PublicSubnetCount, 4], !Equals [!Ref PrivateSubnetCount, 4]]
  CreateNACLs: !Equals [!Ref EnableNACLs, 'true']

  # NACL Associations
  PrivateSubnet1NACLAssociation: !And [!Equals [!Ref EnableNACLs, 'true'], !Or [!Equals [!Ref PrivateSubnetCount, 1], !Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  PrivateSubnet2NACLAssociation: !And [!Equals [!Ref EnableNACLs, 'true'], !Or [!Equals [!Ref PrivateSubnetCount, 2], !Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  PrivateSubnet3NACLAssociation: !And [!Equals [!Ref EnableNACLs, 'true'], !Or [!Equals [!Ref PrivateSubnetCount, 3], !Equals [!Ref PrivateSubnetCount, 4]]]
  PrivateSubnet4NACLAssociation: !And [!Equals [!Ref EnableNACLs, 'true'], !Equals [!Ref PrivateSubnetCount, 4]]

  # Security Group Conditions
  CreateHTTPRule: !Equals [!Ref AllowHTTPFromInternet, 'true']
  CreateHTTPSRule: !Equals [!Ref AllowHTTPSFromInternet, 'true']
  HasPublicCidr: !Not [!Equals [!Ref PublicSubnetCidr, '']]
  AllowSSHFromPrivateWithCidr: !And [!Equals [!Ref AllowSSHFromPrivate, 'true'], !Not [!Equals [!Ref PrivateSubnetCidr, '']]]
  AllowPingFromPrivateWithCidr: !And [!Equals [!Ref AllowPingFromPrivate, 'true'], !Not [!Equals [!Ref PrivateSubnetCidr, '']]]

Resources:
  # ============================================================================
  # VPC
  # ============================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidrBlock
      EnableDnsHostnames: !If [EnableDns, true, false]
      EnableDnsSupport: !If [EnableDns, true, false]
      Tags:
        - Key: Name
          Value: !If [HasCiSuffix, !Sub '${ApplicationPrefix}-vpc-${CiSuffix}', !Sub '${ApplicationPrefix}-vpc']

  # ============================================================================
  # Internet Gateway
  # ============================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateInternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationPrefix}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateInternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================================
  # Public Subnets
  # ============================================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref PublicSubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ1
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-1', !Sub '${PublicSubnetNamePrefix}-1']
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref PublicSubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ2
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-2', !Sub '${PublicSubnetNamePrefix}-2']
        - Key: Type
          Value: Public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet3
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref PublicSubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ3
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-3', !Sub '${PublicSubnetNamePrefix}-3']
        - Key: Type
          Value: Public

  PublicSubnet4:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet4
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [3, !Ref PublicSubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ4
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-4', !Sub '${PublicSubnetNamePrefix}-4']
        - Key: Type
          Value: Public

  # ============================================================================
  # Public Route Table (shared across public subnets)
  # ============================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicRT, !Sub '${ApplicationPrefix}-pub-rt', !Ref PublicRouteTableNamePrefix]
        - Key: Type
          Value: Public

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet1
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet3
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet4
    Properties:
      SubnetId: !Ref PublicSubnet4
      RouteTableId: !Ref PublicRouteTable

  # ============================================================================
  # Private Subnets
  # ============================================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivateSubnet1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref PrivateSubnetCidrBlocks]
      AvailabilityZone: !Ref PrivateSubnetAZ1
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateSubnets, !Sub '${ApplicationPrefix}-pvt-subnet-1', !Sub '${PrivateSubnetNamePrefix}-1']
        - Key: Type
          Value: Private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivateSubnet2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref PrivateSubnetCidrBlocks]
      AvailabilityZone: !Ref PrivateSubnetAZ2
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateSubnets, !Sub '${ApplicationPrefix}-pvt-subnet-2', !Sub '${PrivateSubnetNamePrefix}-2']
        - Key: Type
          Value: Private

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivateSubnet3
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref PrivateSubnetCidrBlocks]
      AvailabilityZone: !Ref PrivateSubnetAZ3
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateSubnets, !Sub '${ApplicationPrefix}-pvt-subnet-3', !Sub '${PrivateSubnetNamePrefix}-3']
        - Key: Type
          Value: Private

  PrivateSubnet4:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivateSubnet4
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [3, !Ref PrivateSubnetCidrBlocks]
      AvailabilityZone: !Ref PrivateSubnetAZ4
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateSubnets, !Sub '${ApplicationPrefix}-pvt-subnet-4', !Sub '${PrivateSubnetNamePrefix}-4']
        - Key: Type
          Value: Private

  # ============================================================================
  # Private Route Tables (one per AZ for granular routing)
  # ============================================================================

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivateSubnet1
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateRT, !Sub '${ApplicationPrefix}-pvt-rt-1', !Sub '${PrivateRouteTableNamePrefix}-1']
        - Key: Type
          Value: Private

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivateSubnet2
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateRT, !Sub '${ApplicationPrefix}-pvt-rt-2', !Sub '${PrivateRouteTableNamePrefix}-2']
        - Key: Type
          Value: Private

  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivateSubnet3
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateRT, !Sub '${ApplicationPrefix}-pvt-rt-3', !Sub '${PrivateRouteTableNamePrefix}-3']
        - Key: Type
          Value: Private

  PrivateRouteTable4:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivateSubnet4
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPrivateRT, !Sub '${ApplicationPrefix}-pvt-rt-4', !Sub '${PrivateRouteTableNamePrefix}-4']
        - Key: Type
          Value: Private

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivateSubnet1
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivateSubnet2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivateSubnet3
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  PrivateSubnet4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivateSubnet4
    Properties:
      SubnetId: !Ref PrivateSubnet4
      RouteTableId: !Ref PrivateRouteTable4

  # ============================================================================
  # Multi-AZ NAT Gateways with Elastic IPs
  # ============================================================================

  NATGatewayEIP1:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway1
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip-1'

  NATGateway1:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway1
    Properties:
      AllocationId: !GetAtt NATGatewayEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw-1'

  PrivateRoute1:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway1
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway1

  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway2
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip-2'

  NATGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway2
    Properties:
      AllocationId: !GetAtt NATGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw-2'

  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway2
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway2

  NATGatewayEIP3:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway3
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip-3'

  NATGateway3:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway3
    Properties:
      AllocationId: !GetAtt NATGatewayEIP3.AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw-3'

  PrivateRoute3:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway3
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway3

  NATGatewayEIP4:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway4
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip-4'

  NATGateway4:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway4
    Properties:
      AllocationId: !GetAtt NATGatewayEIP4.AllocationId
      SubnetId: !Ref PublicSubnet4
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gw-4'

  PrivateRoute4:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway4
    Properties:
      RouteTableId: !Ref PrivateRouteTable4
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway4

  # ============================================================================
  # Private Network ACLs
  # ============================================================================

  PrivateNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Condition: CreateNACLs
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-nacl'
        - Key: Type
          Value: Private

  PrivateNACLInboundFromPublic:
    Type: AWS::EC2::NetworkAclEntry
    Condition: CreateNACLs
    Properties:
      NetworkAclId: !Ref PrivateNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref VPCCidrBlock
      PortRange:
        From: 0
        To: 65535

  PrivateNACLInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Condition: CreateNACLs
    Properties:
      NetworkAclId: !Ref PrivateNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PrivateNACLOutboundAll:
    Type: AWS::EC2::NetworkAclEntry
    Condition: CreateNACLs
    Properties:
      NetworkAclId: !Ref PrivateNetworkAcl
      RuleNumber: 100
      Protocol: -1
      Egress: true
      RuleAction: allow
      CidrBlock: 0.0.0.0/0

  PrivateSubnet1NACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: PrivateSubnet1NACLAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      NetworkAclId: !Ref PrivateNetworkAcl

  PrivateSubnet2NACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: PrivateSubnet2NACLAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      NetworkAclId: !Ref PrivateNetworkAcl

  PrivateSubnet3NACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: PrivateSubnet3NACLAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      NetworkAclId: !Ref PrivateNetworkAcl

  PrivateSubnet4NACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: PrivateSubnet4NACLAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet4
      NetworkAclId: !Ref PrivateNetworkAcl

  # ============================================================================
  # Public Security Group
  # ============================================================================

  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-public-sg'
      GroupDescription: Security group for public subnets
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-sg'

  PublicSGIngressHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateHTTPRule
    Properties:
      GroupId: !Ref PublicSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Allow HTTP from internet

  PublicSGIngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateHTTPSRule
    Properties:
      GroupId: !Ref PublicSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Allow HTTPS from internet

  PublicSGIngressSSHFromPrivate:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowSSHFromPrivateWithCidr
    Properties:
      GroupId: !Ref PublicSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref PrivateSubnetCidr
      Description: Allow SSH from private subnets

  PublicSGIngressPingFromPrivate:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowPingFromPrivateWithCidr
    Properties:
      GroupId: !Ref PublicSecurityGroup
      IpProtocol: icmp
      FromPort: -1
      ToPort: -1
      CidrIp: !Ref PrivateSubnetCidr
      Description: Allow PING from private subnets

  PublicSGEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PublicSecurityGroup
      IpProtocol: -1
      CidrIp: 0.0.0.0/0
      Description: Allow all outbound traffic

  # ============================================================================
  # Private Security Group
  # ============================================================================

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-private-sg'
      GroupDescription: Security group for private subnets
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-sg'

  PrivateSGIngressFromPublic:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasPublicCidr
    Properties:
      GroupId: !Ref PrivateSecurityGroup
      IpProtocol: -1
      CidrIp: !Ref PublicSubnetCidr
      Description: Allow all traffic from public subnets

  PrivateSGIngressFromSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PrivateSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref PrivateSecurityGroup
      Description: Allow all traffic from within private subnets

  PrivateSGEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateSecurityGroup
      IpProtocol: -1
      CidrIp: 0.0.0.0/0
      Description: Allow all outbound traffic

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  VPCCidr:
    Description: VPC CIDR Block
    Value: !GetAtt VPC.CidrBlock

  InternetGatewayId:
    Description: Internet Gateway ID
    Condition: CreateInternetGateway
    Value: !Ref InternetGateway

  PublicSubnetIds:
    Description: Public Subnet IDs (comma-separated)
    Value: !If
      - CreatePublicSubnet4
      - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3, !Ref PublicSubnet4]]
      - !If
        - CreatePublicSubnet3
        - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
        - !If
          - CreatePublicSubnet2
          - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
          - !If
            - CreatePublicSubnet1
            - !Ref PublicSubnet1
            - ''

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Condition: CreatePublicSubnet1
    Value: !Ref PublicSubnet1

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Condition: CreatePublicSubnet2
    Value: !Ref PublicSubnet2

  PublicSubnet3Id:
    Description: Public Subnet 3 ID
    Condition: CreatePublicSubnet3
    Value: !Ref PublicSubnet3

  PublicSubnet4Id:
    Description: Public Subnet 4 ID
    Condition: CreatePublicSubnet4
    Value: !Ref PublicSubnet4

  PublicRouteTableId:
    Description: Public Route Table ID
    Value: !Ref PublicRouteTable

  PrivateSubnetIds:
    Description: Private Subnet IDs (comma-separated)
    Value: !If
      - CreatePrivateSubnet4
      - !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3, !Ref PrivateSubnet4]]
      - !If
        - CreatePrivateSubnet3
        - !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
        - !If
          - CreatePrivateSubnet2
          - !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
          - !If
            - CreatePrivateSubnet1
            - !Ref PrivateSubnet1
            - ''

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Condition: CreatePrivateSubnet1
    Value: !Ref PrivateSubnet1

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Condition: CreatePrivateSubnet2
    Value: !Ref PrivateSubnet2

  PrivateSubnet3Id:
    Description: Private Subnet 3 ID
    Condition: CreatePrivateSubnet3
    Value: !Ref PrivateSubnet3

  PrivateSubnet4Id:
    Description: Private Subnet 4 ID
    Condition: CreatePrivateSubnet4
    Value: !Ref PrivateSubnet4

  PrivateRouteTableIds:
    Description: Private Route Table IDs (comma-separated)
    Value: !If
      - CreatePrivateSubnet4
      - !Join [',', [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PrivateRouteTable3, !Ref PrivateRouteTable4]]
      - !If
        - CreatePrivateSubnet3
        - !Join [',', [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PrivateRouteTable3]]
        - !If
          - CreatePrivateSubnet2
          - !Join [',', [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2]]
          - !If
            - CreatePrivateSubnet1
            - !Ref PrivateRouteTable1
            - ''

  PrivateRouteTable1Id:
    Description: Private Route Table 1 ID
    Condition: CreatePrivateSubnet1
    Value: !Ref PrivateRouteTable1

  PrivateRouteTable2Id:
    Description: Private Route Table 2 ID
    Condition: CreatePrivateSubnet2
    Value: !Ref PrivateRouteTable2

  PrivateRouteTable3Id:
    Description: Private Route Table 3 ID
    Condition: CreatePrivateSubnet3
    Value: !Ref PrivateRouteTable3

  PrivateRouteTable4Id:
    Description: Private Route Table 4 ID
    Condition: CreatePrivateSubnet4
    Value: !Ref PrivateRouteTable4

  NATGatewayIds:
    Description: NAT Gateway IDs (comma-separated, if enabled)
    Condition: EnableNAT
    Value: !If
      - CreateNATGateway4
      - !Join [',', [!Ref NATGateway1, !Ref NATGateway2, !Ref NATGateway3, !Ref NATGateway4]]
      - !If
        - CreateNATGateway3
        - !Join [',', [!Ref NATGateway1, !Ref NATGateway2, !Ref NATGateway3]]
        - !If
          - CreateNATGateway2
          - !Join [',', [!Ref NATGateway1, !Ref NATGateway2]]
          - !If
            - CreateNATGateway1
            - !Ref NATGateway1
            - 'N/A'

  NATGatewayIps:
    Description: NAT Gateway Elastic IPs (comma-separated, if enabled)
    Condition: EnableNAT
    Value: !If
      - CreateNATGateway4
      - !Join [',', [!Ref NATGatewayEIP1, !Ref NATGatewayEIP2, !Ref NATGatewayEIP3, !Ref NATGatewayEIP4]]
      - !If
        - CreateNATGateway3
        - !Join [',', [!Ref NATGatewayEIP1, !Ref NATGatewayEIP2, !Ref NATGatewayEIP3]]
        - !If
          - CreateNATGateway2
          - !Join [',', [!Ref NATGatewayEIP1, !Ref NATGatewayEIP2]]
          - !If
            - CreateNATGateway1
            - !Ref NATGatewayEIP1
            - 'N/A'

  NetworkAclId:
    Description: Private Network ACL ID
    Condition: CreateNACLs
    Value: !Ref PrivateNetworkAcl

  PublicSecurityGroupId:
    Description: Public Security Group ID
    Value: !Ref PublicSecurityGroup

  PrivateSecurityGroupId:
    Description: Private Security Group ID
    Value: !Ref PrivateSecurityGroup
