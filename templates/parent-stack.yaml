AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parent/root stack that orchestrates VPC, public subnets, private subnets, and security groups'

Parameters:
  ApplicationPrefix:
    Type: String
    Description: Application name prefix (used for naming VPC, subnets, route tables, etc.)
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    ConstraintDescription: Must start with a letter and contain only alphanumeric characters and hyphens

  EnvironmentName:
    Type: String
    Description: Environment name prefix

  VPCCidrBlock:
    Type: String
    Description: CIDR block for the VPC

  EnableInternetGateway:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableDnsHostnames:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  PublicSubnetCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4

  PublicSubnetCidrBlocks:
    Type: CommaDelimitedList
    Default: ''
    Description: CIDR blocks for public subnets (leave empty if none)

  PublicAvailabilityZones:
    Type: CommaDelimitedList
    Default: ''
    Description: AZs for public subnets (leave empty if none)

  PrivateSubnetCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4

  PrivateSubnetCidrBlocks:
    Type: CommaDelimitedList
    Default: ''
    Description: CIDR blocks for private subnets (leave empty if none)

  PrivateAvailabilityZones:
    Type: CommaDelimitedList
    Default: ''
    Description: AZs for private subnets (DEPRECATED - use PrivateSubnetAZ1-4)

  PublicSubnetAZ1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 1
    Default: us-east-1a

  PublicSubnetAZ2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 2
    Default: us-east-1b

  PublicSubnetAZ3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 3
    Default: us-east-1c

  PublicSubnetAZ4:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 4
    Default: us-east-1d

  PrivateSubnetAZ1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 1
    Default: us-east-1a

  PrivateSubnetAZ2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 2
    Default: us-east-1b

  PrivateSubnetAZ3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 3
    Default: us-east-1c

  PrivateSubnetAZ4:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Private Subnet 4
    Default: us-east-1d

  EnableNATGateway:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableHighAvailabilityNAT:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableNACLs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  CreateSecurityGroups:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  PublicSubnetCidr:
    Type: String
    Default: ''
    Description: Public subnet CIDR range for security group rules

  PrivateSubnetCidr:
    Type: String
    Default: ''
    Description: Private subnet CIDR range for security group rules

  AllowSSHFromPrivate:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  AllowPingFromPrivate:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  AllowHTTPFromInternet:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  AllowHTTPSFromInternet:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  PublicSubnetNamePrefix:
    Type: String
    Description: Name prefix for public subnets (e.g., 'myapp-pub-subnet')
    Default: 'public-subnet'

  PublicRouteTableNamePrefix:
    Type: String
    Description: Name prefix for public route tables
    Default: 'public-rt'

  PrivateSubnetNamePrefix:
    Type: String
    Description: Name prefix for private subnets (e.g., 'myapp-db-pvt-subnet', 'myapp-app-pvt-subnet')
    Default: 'private-subnet'

  PrivateRouteTableNamePrefix:
    Type: String
    Description: Name prefix for private route tables
    Default: 'private-rt'

  TemplatesS3Bucket:
    Type: String
    Description: S3 bucket containing nested templates (e.g., 'my-cfn-templates')

  TemplatesS3Prefix:
    Type: String
    Default: 'templates'
    Description: S3 prefix for templates (e.g., 'templates')

Conditions:
  CreatePublicSubnets: !Not [!Equals [!Ref PublicSubnetCount, 0]]
  CreatePrivateSubnets: !Not [!Equals [!Ref PrivateSubnetCount, 0]]
  CreateSecurityGroups: !Equals [!Ref CreateSecurityGroups, 'true']

Resources:
  # ============================================================================
  # VPC Stack
  # ============================================================================

  VPCStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://s3.amazonaws.com/${TemplatesS3Bucket}/${TemplatesS3Prefix}/vpc-igw.yaml'
      Parameters:
        ApplicationPrefix: !Ref ApplicationPrefix
        EnvironmentName: !Ref EnvironmentName
        VPCCidrBlock: !Ref VPCCidrBlock
        EnableInternetGateway: !Ref EnableInternetGateway
        EnableDnsHostnames: !Ref EnableDnsHostnames
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # Public Subnets Stack
  # ============================================================================

  PublicSubnetsStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreatePublicSubnets
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://s3.amazonaws.com/${TemplatesS3Bucket}/${TemplatesS3Prefix}/public-subnets.yaml'
      Parameters:
        ApplicationPrefix: !Ref ApplicationPrefix
        EnvironmentName: !Ref EnvironmentName
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        InternetGatewayId: !GetAtt VPCStack.Outputs.InternetGatewayId
        SubnetCount: !Ref PublicSubnetCount
        SubnetCidrBlocks: !Join [',', !Ref PublicSubnetCidrBlocks]
        AvailabilityZones: !Join [',', !Ref PublicAvailabilityZones]
        PublicSubnetAZ1: !Ref PublicSubnetAZ1
        PublicSubnetAZ2: !Ref PublicSubnetAZ2
        PublicSubnetAZ3: !Ref PublicSubnetAZ3
        PublicSubnetAZ4: !Ref PublicSubnetAZ4
        MapPublicIpOnLaunch: 'true'
        PublicSubnetNamePrefix: !Ref PublicSubnetNamePrefix
        PublicRouteTableNamePrefix: !Ref PublicRouteTableNamePrefix
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # Private Subnets Stack
  # ============================================================================

  PrivateSubnetsStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreatePrivateSubnets
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://s3.amazonaws.com/${TemplatesS3Bucket}/${TemplatesS3Prefix}/private-subnets.yaml'
      Parameters:
        ApplicationPrefix: !Ref ApplicationPrefix
        EnvironmentName: !Ref EnvironmentName
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        SubnetCount: !Ref PrivateSubnetCount
        SubnetCidrBlocks: !Join [',', !Ref PrivateSubnetCidrBlocks]
        AvailabilityZones: !Join [',', !Ref PrivateAvailabilityZones]
        PrivateSubnetAZ1: !Ref PrivateSubnetAZ1
        PrivateSubnetAZ2: !Ref PrivateSubnetAZ2
        PrivateSubnetAZ3: !Ref PrivateSubnetAZ3
        PrivateSubnetAZ4: !Ref PrivateSubnetAZ4
        EnableNATGateway: !Ref EnableNATGateway
        EnableHighAvailabilityNAT: !Ref EnableHighAvailabilityNAT
        PublicSubnetIds: !If
          - CreatePublicSubnets
          - !GetAtt PublicSubnetsStack.Outputs.PublicSubnetIds
          - ''
        EnableNACLs: !Ref EnableNACLs
        PrivateSubnetNamePrefix: !Ref PrivateSubnetNamePrefix
        PrivateRouteTableNamePrefix: !Ref PrivateRouteTableNamePrefix
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # Security Groups Stack
  # ============================================================================

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateSecurityGroups
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://s3.amazonaws.com/${TemplatesS3Bucket}/${TemplatesS3Prefix}/security-groups.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
        AllowSSHFromPrivate: !Ref AllowSSHFromPrivate
        AllowPingFromPrivate: !Ref AllowPingFromPrivate
        AllowHTTPFromInternet: !Ref AllowHTTPFromInternet
        AllowHTTPSFromInternet: !Ref AllowHTTPSFromInternet
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  VPCId:
    Description: VPC ID
    Value: !GetAtt VPCStack.Outputs.VPCId
    Export:
      Name: !Sub '${EnvironmentName}-vpc-id'

  VPCCidr:
    Description: VPC CIDR Block
    Value: !GetAtt VPCStack.Outputs.VPCCidr
    Export:
      Name: !Sub '${EnvironmentName}-vpc-cidr'

  PublicSubnetIds:
    Description: Public Subnet IDs
    Condition: CreatePublicSubnets
    Value: !GetAtt PublicSubnetsStack.Outputs.PublicSubnetIds
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-ids'

  PrivateSubnetIds:
    Description: Private Subnet IDs
    Condition: CreatePrivateSubnets
    Value: !GetAtt PrivateSubnetsStack.Outputs.SubnetIds
    Export:
      Name: !Sub '${EnvironmentName}-private-subnet-ids'

  PublicSecurityGroupId:
    Description: Public Security Group ID
    Condition: CreateSecurityGroups
    Value: !GetAtt SecurityGroupsStack.Outputs.PublicSecurityGroupId
    Export:
      Name: !Sub '${EnvironmentName}-public-sg-id'

  PrivateSecurityGroupId:
    Description: Private Security Group ID
    Condition: CreateSecurityGroups
    Value: !GetAtt SecurityGroupsStack.Outputs.PrivateSecurityGroupId
    Export:
      Name: !Sub '${EnvironmentName}-private-sg-id'
