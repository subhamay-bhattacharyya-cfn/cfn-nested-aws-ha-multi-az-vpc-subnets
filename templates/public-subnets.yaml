AWSTemplateFormatVersion: '2010-09-09'
Description: 'Nested template for public subnets with internet access'

Parameters:
  ApplicationPrefix:
    Type: String
    Description: Application name prefix (used for resource naming)
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    ConstraintDescription: Must start with a letter and contain only alphanumeric characters and hyphens

  EnvironmentName:
    Type: String
    Description: Environment name prefix

  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID to attach subnets to

  InternetGatewayId:
    Type: String
    Description: Internet Gateway ID for routing

  SubnetCount:
    Type: Number
    Description: Number of public subnets to create
    MinValue: 1
    MaxValue: 4

  SubnetCidrBlocks:
    Type: CommaDelimitedList
    Description: CIDR blocks for public subnets

  AvailabilityZones:
    Type: CommaDelimitedList
    Description: Availability Zones for subnets (DEPRECATED - use PublicSubnetAZ1-4 for individual control)

  PublicSubnetAZ1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 1

  PublicSubnetAZ2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 2

  PublicSubnetAZ3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 3

  PublicSubnetAZ4:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for Public Subnet 4

  MapPublicIpOnLaunch:
    Type: String
    Description: Automatically assign public IPs to instances in public subnets
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PublicSubnetNamePrefix:
    Type: String
    Description: Name prefix for public subnets (leave empty to use ApplicationPrefix-pub-subnet)
    Default: ''

  PublicRouteTableNamePrefix:
    Type: String
    Description: Name prefix for public route tables (leave empty to use ApplicationPrefix-pub-rt)
    Default: ''

Conditions:
  UseAppPrefixForPublicSubnets: !Equals [!Ref PublicSubnetNamePrefix, '']
  UseAppPrefixForPublicRT: !Equals [!Ref PublicRouteTableNamePrefix, '']
  CreatePublicSubnet1: !Or
    - !Equals [!Ref SubnetCount, 1]
    - !Equals [!Ref SubnetCount, 2]
    - !Equals [!Ref SubnetCount, 3]
    - !Equals [!Ref SubnetCount, 4]

  CreatePublicSubnet2: !Or
    - !Equals [!Ref SubnetCount, 2]
    - !Equals [!Ref SubnetCount, 3]
    - !Equals [!Ref SubnetCount, 4]

  CreatePublicSubnet3: !Or
    - !Equals [!Ref SubnetCount, 3]
    - !Equals [!Ref SubnetCount, 4]

  CreatePublicSubnet4: !Equals [!Ref SubnetCount, 4]

  MapPublicIp: !Equals [!Ref MapPublicIpOnLaunch, 'true']

Resources:
  # ============================================================================
  # Public Subnets
  # ============================================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet1
    Properties:
      VpcId: !Ref VPCId
      CidrBlock: !Select [0, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ1
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-1', !Sub '${PublicSubnetNamePrefix}-1']
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet2
    Properties:
      VpcId: !Ref VPCId
      CidrBlock: !Select [1, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ2
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-2', !Sub '${PublicSubnetNamePrefix}-2']
        - Key: Type
          Value: Public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet3
    Properties:
      VpcId: !Ref VPCId
      CidrBlock: !Select [2, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ3
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-3', !Sub '${PublicSubnetNamePrefix}-3']
        - Key: Type
          Value: Public

  PublicSubnet4:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicSubnet4
    Properties:
      VpcId: !Ref VPCId
      CidrBlock: !Select [3, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Ref PublicSubnetAZ4
      MapPublicIpOnLaunch: !If [MapPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicSubnets, !Sub '${ApplicationPrefix}-pub-subnet-4', !Sub '${PublicSubnetNamePrefix}-4']
        - Key: Type
          Value: Public

  # ============================================================================
  # Public Route Table (shared across public subnets)
  # ============================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !If [UseAppPrefixForPublicRT, !Sub '${ApplicationPrefix}-pub-rt', !Ref PublicRouteTableNamePrefix]
        - Key: Type
          Value: Public

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet1
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet3
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicSubnet4
    Properties:
      SubnetId: !Ref PublicSubnet4
      RouteTableId: !Ref PublicRouteTable

Outputs:
  PublicSubnetIds:
    Description: Public Subnet IDs (comma-separated)
    Value: !If
      - CreatePublicSubnet4
      - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3, !Ref PublicSubnet4]]
      - !If
        - CreatePublicSubnet3
        - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
        - !If
          - CreatePublicSubnet2
          - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
          - !If
            - CreatePublicSubnet1
            - !Ref PublicSubnet1
            - ''
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-ids'

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Condition: CreatePublicSubnet1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-1-id'

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Condition: CreatePublicSubnet2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-2-id'

  PublicSubnet3Id:
    Description: Public Subnet 3 ID
    Condition: CreatePublicSubnet3
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-3-id'

  PublicSubnet4Id:
    Description: Public Subnet 4 ID
    Condition: CreatePublicSubnet4
    Value: !Ref PublicSubnet4
    Export:
      Name: !Sub '${EnvironmentName}-public-subnet-4-id'

  PublicRouteTableId:
    Description: Public Route Table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub '${EnvironmentName}-public-rt-id'
